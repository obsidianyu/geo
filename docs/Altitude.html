<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEO-COMPASS Pro - 數位野外地質助理</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <!-- 引入 Proj4js 用於座標轉換 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <style>
        /* 隱藏捲軸但保留滾動功能，為了更像原生 App */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        body {
            -webkit-tap-highlight-color: transparent; /* 移除點擊高光 */
        }
        /* 底部安全區佔位 (iPhone) 加入預設彈性空間 */
        .pb-safe {
            padding-bottom: max(env(safe-area-inset-bottom), 12px);
        }
    </style>
</head>
<!-- 修正 body 高度，改用 fixed inset-0 確保與裝置可視範圍完美貼合 -->
<body class="bg-gray-200 flex justify-center fixed inset-0 overflow-hidden selection:bg-blue-200">

    <!-- 模擬手機畫面容器 (改為標準 Flex 佈局，不再使用 relative/absolute 定位) -->
    <div class="w-full max-w-md bg-gray-50 h-full flex flex-col font-sans shadow-2xl">
        
        <!-- 頂部 Header -->
        <header class="bg-slate-900 text-white p-4 shadow-md z-10 flex justify-between items-center shrink-0">
            <div>
                <h1 class="text-lg font-black tracking-wider">GEO-COMPASS Pro</h1>
                <p class="text-xs text-slate-400">數位野外地質助理</p>
            </div>
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
        </header>

        <!-- 內容區塊 -->
        <main id="main-content" class="flex-1 overflow-y-auto relative">
            
            <!-- 量測分頁 (Measure Tab) 移除過多的 pb-24，改為 pb-6 -->
            <div id="tab-measure" class="p-4 space-y-4 pb-6 tab-content">
                <!-- 羅盤顯示區 -->
                <div id="compass-card" class="bg-white p-6 rounded-2xl shadow-lg text-center transition-colors duration-300">
                    <h2 class="text-gray-500 font-bold mb-2">走向 / 傾角 (Strike / Dip)</h2>
                    <div class="text-6xl font-black text-gray-800 flex justify-center items-baseline gap-2">
                        <span id="val-strike">000</span><span class="text-3xl">°</span> 
                        <span class="text-gray-300 font-light">/</span> 
                        <span id="val-dip">00</span><span class="text-3xl">°</span>
                    </div>
                    <!-- 新增：方位角模式 (Quadrant Notation) -->
                    <div class="text-blue-600 font-semibold mt-1 text-lg" id="val-quadrant">N00°E / 00°SE</div>
                    
                    <!-- 新增切換按鈕：點擊切換 WGS84 / TWD97 -->
                    <div class="mt-4 flex justify-between items-center text-sm text-gray-500 bg-gray-100 p-3 rounded-lg cursor-pointer active:bg-gray-200 transition-colors" onclick="toggleCoordSystem()">
                        <div class="flex items-center gap-1">
                            <i data-feather="map-pin" class="w-4 h-4"></i> 
                            <span id="coord-label" class="font-bold text-slate-700 bg-slate-200 px-1 rounded">WGS84</span>
                            <span id="val-coords">---, ---</span>
                        </div>
                        <div>誤差 ±<span id="val-acc">-</span>m</div>
                    </div>

                    <button id="btn-lock" class="bg-blue-600 text-white mt-4 w-full py-4 rounded-xl font-bold text-lg shadow-md transition-all active:scale-95">
                        鎖定數值 (Lock)
                    </button>
                    <!-- 新增：iOS 感測器啟動按鈕 -->
                    <button id="btn-start-sensor" onclick="requestSensorPermission()" class="bg-emerald-600 text-white mt-2 w-full py-3 rounded-xl font-bold text-md shadow-md transition-all active:scale-95 hidden">
                        啟動羅盤感測器 (iOS 必點)
                    </button>
                </div>

                <!-- 弱面類型選擇 -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <!-- 新增：露頭編號 -->
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-gray-100">
                        <h3 class="font-bold text-gray-700">露頭編號 (Outcrop ID)</h3>
                        <div class="flex items-center gap-3 bg-gray-100 rounded-lg p-1">
                            <button onclick="changeOutcrop(-1)" class="w-8 h-8 flex items-center justify-center bg-white rounded shadow text-gray-600 font-bold active:scale-95">-</button>
                            <span id="val-outcrop" class="font-black text-gray-800 w-14 text-center">OC-01</span>
                            <button onclick="changeOutcrop(1)" class="w-8 h-8 flex items-center justify-center bg-white rounded shadow text-gray-600 font-bold active:scale-95">+</button>
                        </div>
                    </div>

                    <h3 class="font-bold text-gray-700 mb-2">弱面類型</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setType('層面')" id="btn-type-層面" class="type-btn border-gray-200 bg-white text-gray-500 py-3 rounded-lg font-bold border-2 transition-all flex flex-col items-center">
                            <i data-feather="layers" class="mb-1 w-5 h-5"></i>層面
                        </button>
                        <button onclick="setType('節理面')" id="btn-type-節理面" class="type-btn border-blue-600 bg-blue-50 text-blue-700 py-3 rounded-lg font-bold border-2 transition-all flex flex-col items-center">
                            <i data-feather="edit-3" class="mb-1 w-5 h-5"></i>節理面
                        </button>
                        <button onclick="setType('坡面')" id="btn-type-坡面" class="type-btn border-gray-200 bg-white text-gray-500 py-3 rounded-lg font-bold border-2 transition-all flex flex-col items-center">
                            <i data-feather="alert-triangle" class="mb-1 w-5 h-5"></i>坡面
                        </button>
                    </div>

                    <!-- 新增：節理組別選擇 (預設顯示因為預設是節理面) -->
                    <div id="joint-set-container" class="mt-4 pt-3 border-t border-gray-100">
                        <h3 class="font-bold text-gray-700 mb-2 text-sm">節理組別區分 (Joint Set)</h3>
                        <div class="grid grid-cols-4 gap-2">
                            <button onclick="setJointSet('J1')" id="btn-joint-J1" class="joint-btn border-blue-600 bg-blue-50 text-blue-700 py-2 rounded-lg font-bold border-2 transition-all">J1</button>
                            <button onclick="setJointSet('J2')" id="btn-joint-J2" class="joint-btn border-gray-200 bg-white text-gray-500 py-2 rounded-lg font-bold border-2 transition-all">J2</button>
                            <button onclick="setJointSet('J3')" id="btn-joint-J3" class="joint-btn border-gray-200 bg-white text-gray-500 py-2 rounded-lg font-bold border-2 transition-all">J3</button>
                            <button onclick="setJointSet('無')" id="btn-joint-無" class="joint-btn border-gray-200 bg-white text-gray-500 py-2 rounded-lg font-bold border-2 transition-all">無</button>
                        </div>
                    </div>
                </div>

                <!-- 附加資訊 -->
                <div class="space-y-2">
                    <h3 class="font-bold text-gray-700">附加資訊</h3>
                    <button class="w-full bg-gray-100 text-gray-700 py-4 rounded-lg flex items-center justify-center gap-2 border border-gray-300 font-semibold active:bg-gray-200">
                        <i data-feather="camera" class="w-5 h-5"></i> 拍攝現地照片與標註
                    </button>
                    <textarea id="input-remark" placeholder="輸入地質特徵備註..." class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none resize-none" rows="3"></textarea>
                </div>

                <!-- 儲存按鈕 -->
                <button id="btn-save" class="bg-gray-300 text-gray-500 cursor-not-allowed w-full py-5 rounded-xl font-black text-xl shadow-lg flex justify-center items-center gap-2 transition-all active:scale-95">
                    <i data-feather="save" class="w-6 h-6"></i> 儲存紀錄 (SAVE)
                </button>
            </div>

            <!-- 紀錄分頁 (List Tab) 移除過多的 pb-24，改為 pb-6 -->
            <div id="tab-list" class="hidden p-4 space-y-4 pb-6 h-full bg-gray-50 tab-content">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">已儲存紀錄 (<span id="list-count">0</span>)</h2>
                    <button onclick="exportKML()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 shadow hover:bg-blue-700 active:scale-95 transition-transform">
                        <i data-feather="download" class="w-4 h-4"></i> 匯出 KML
                    </button>
                </div>
                
                <div id="list-container" class="space-y-3">
                    <!-- 紀錄列表將透過 JS 產生於此 -->
                    <div class="text-center text-gray-400 py-10" id="empty-state">尚無資料，請至測量頁面記錄。</div>
                </div>
            </div>

            <!-- 地圖與分析 Placeholder (Map / Analysis Tab) -->
            <div id="tab-map" class="hidden h-full flex flex-col items-center justify-center text-gray-400 tab-content">
                <i data-feather="map" class="w-12 h-12 text-blue-300 mb-4"></i>
                <h2 class="text-xl font-bold">地圖視角</h2>
                <p class="text-sm mt-2 max-w-xs text-center">此功能將整合 Leaflet.js 地圖，敬請期待後續開發階段。</p>
            </div>

            <div id="tab-analysis" class="hidden h-full flex flex-col items-center justify-center text-gray-400 tab-content">
                <i data-feather="compass" class="w-12 h-12 text-purple-300 mb-4"></i>
                <h2 class="text-xl font-bold">赤平投影與破壞分析</h2>
                <p class="text-sm mt-2 max-w-xs text-center">此功能將整合 D3.js 繪製投影圓，敬請期待後續開發階段。</p>
            </div>

        </main>

        <!-- 底部導航列 (改為 Flex 元素 shrink-0 排列，不再使用 absolute，避免遮擋) -->
        <nav class="w-full bg-white border-t border-gray-200 flex justify-around pt-2 px-2 pb-safe shadow-[0_-4px_15px_rgba(0,0,0,0.05)] z-20 shrink-0">
            <button onclick="switchTab('measure')" id="nav-measure" class="nav-btn text-blue-600 flex flex-col items-center p-2 min-w-[70px] transition-colors">
                <div class="scale-110 transition-transform duration-200 mb-1"><i data-feather="compass"></i></div>
                <span class="text-[10px] font-bold">量測</span>
            </button>
            <button onclick="switchTab('list')" id="nav-list" class="nav-btn text-gray-400 hover:text-gray-600 flex flex-col items-center p-2 min-w-[70px] transition-colors">
                <div class="scale-100 transition-transform duration-200 mb-1"><i data-feather="list"></i></div>
                <span class="text-[10px] font-bold">紀錄</span>
            </button>
            <button onclick="switchTab('map')" id="nav-map" class="nav-btn text-gray-400 hover:text-gray-600 flex flex-col items-center p-2 min-w-[70px] transition-colors">
                <div class="scale-100 transition-transform duration-200 mb-1"><i data-feather="map"></i></div>
                <span class="text-[10px] font-bold">地圖</span>
            </button>
            <button onclick="switchTab('analysis')" id="nav-analysis" class="nav-btn text-gray-400 hover:text-gray-600 flex flex-col items-center p-2 min-w-[70px] transition-colors">
                <div class="scale-100 transition-transform duration-200 mb-1"><i data-feather="alert-triangle"></i></div>
                <span class="text-[10px] font-bold">分析</span>
            </button>
        </nav>
    </div>

    <!-- 腳本邏輯 -->
    <script>
        // 初始化 Feather Icons
        feather.replace();

        // 註冊 TWD97 (EPSG:3826) 投影參數
        proj4.defs("EPSG:3826", "+proj=tmerc +lat_0=0 +lon_0=121 +k=0.9999 +x_0=250000 +y_0=0 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");

        // 狀態變數
        let measurements = [];
        let sensorData = { strike: 0, dip: 0, lat: 0, lng: 0, accuracy: 0 };
        let currentType = '節理面';
        let currentJointSet = 'J1'; // 新增：目前節理組別
        let outcropIndex = 1;       // 新增：露頭編號
        let isLocked = false;
        let coordSystem = 'WGS84'; // 'WGS84' 或是 'TWD97'

        // DOM 元素快取
        const elStrike = document.getElementById('val-strike');
        const elDip = document.getElementById('val-dip');
        const elLat = document.getElementById('val-lat');
        const elLng = document.getElementById('val-lng');
        const elCoords = document.getElementById('val-coords');
        const elAcc = document.getElementById('val-acc');
        const elQuadrant = document.getElementById('val-quadrant');
        const btnLock = document.getElementById('btn-lock');
        const btnSave = document.getElementById('btn-save');
        const compassCard = document.getElementById('compass-card');
        const inputRemark = document.getElementById('input-remark');
        const listContainer = document.getElementById('list-container');
        const listCount = document.getElementById('list-count');
        const emptyState = document.getElementById('empty-state');
        
        // 新增 DOM 快取
        const elOutcrop = document.getElementById('val-outcrop'); 
        const jointSetContainer = document.getElementById('joint-set-container'); 
        const btnStartSensor = document.getElementById('btn-start-sensor');

        // 切換座標系統
        function toggleCoordSystem() {
            coordSystem = coordSystem === 'WGS84' ? 'TWD97' : 'WGS84';
            document.getElementById('coord-label').innerText = coordSystem;
            updateSensorUI(); // 立即更新畫面上的座標
        }

        // 啟動真實感測器
        function startSensor() {
            // 嘗試獲取真實 GPS (使用 watchPosition 持續更新)
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    pos => {
                        sensorData.lat = pos.coords.latitude;
                        sensorData.lng = pos.coords.longitude;
                        sensorData.accuracy = pos.coords.accuracy;
                        updateSensorUI();
                    },
                    err => console.log("GPS Error:", err),
                    { enableHighAccuracy: true, maximumAge: 1000 }
                );
            }

            // 檢查是否需要顯示 iOS 的授權按鈕
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                btnStartSensor.classList.remove('hidden');
            } else {
                // 非 iOS，直接啟動監聽真實感測器
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        // 處理 iOS 的權限請求 (綁定於按鈕)
        function requestSensorPermission() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            btnStartSensor.classList.add('hidden');
                        } else {
                            alert('需要動作與方向權限才能運作羅盤');
                        }
                    })
                    .catch(console.error);
            }
        }

        // 處理羅盤真實姿態轉換為走向傾角
        function handleOrientation(event) {
            if (isLocked) return;

            let alpha = event.alpha; 
            let beta = event.beta;   
            let gamma = event.gamma; 

            // 若硬體無感測器資料則略過
            if (alpha === null || beta === null || gamma === null) return;

            // iOS 優先使用絕對正北方位
            if (event.webkitCompassHeading) {
                alpha = event.webkitCompassHeading;
            }

            // 將角度轉為弧度計算
            const rad = Math.PI / 180;
            const bRad = beta * rad;
            const gRad = gamma * rad;

            // 簡化計算傾角 (Dip)
            let dipRad = Math.acos(Math.cos(bRad) * Math.cos(gRad));
            let dip = dipRad / rad;

            // 簡化計算走向 (Strike)
            let strike = (alpha + 90) % 360;

            // 避免異常計算，更新 UI
            if (!isNaN(strike) && !isNaN(dip)) {
                sensorData.strike = Math.round(strike);
                sensorData.dip = Math.round(dip);
                updateSensorUI();
            }
        }

        // 變更露頭編號
        function changeOutcrop(delta) {
            outcropIndex += delta;
            if (outcropIndex < 1) outcropIndex = 1;
            elOutcrop.innerText = `OC-${outcropIndex.toString().padStart(2, '0')}`;
        }

        // 設定節理組別
        function setJointSet(set) {
            currentJointSet = set;
            document.querySelectorAll('.joint-btn').forEach(btn => {
                btn.className = 'joint-btn border-gray-200 bg-white text-gray-500 py-2 rounded-lg font-bold border-2 transition-all';
            });
            const activeBtn = document.getElementById(`btn-joint-${set}`);
            if(activeBtn) activeBtn.className = 'joint-btn border-blue-600 bg-blue-50 text-blue-700 py-2 rounded-lg font-bold border-2 transition-all';
        }

        // 轉換為象限方位角字串 (例如 N32°E / 85°SE)
        function getQuadrantString(strike, dip) {
            // 計算走向的象限
            let qStrike = "";
            if (strike >= 0 && strike < 90) qStrike = `N${strike}°E`;
            else if (strike >= 90 && strike < 180) qStrike = `S${180 - strike}°E`;
            else if (strike >= 180 && strike < 270) qStrike = `S${strike - 180}°W`;
            else qStrike = `N${360 - strike}°W`;

            // 計算傾斜方向的象限 (依據右手定則：走向加 90 度)
            let dipDir = (strike + 90) % 360;
            let qDipDir = "";
            if (dipDir >= 0 && dipDir < 90) qDipDir = "NE";
            else if (dipDir >= 90 && dipDir < 180) qDipDir = "SE";
            else if (dipDir >= 180 && dipDir < 270) qDipDir = "SW";
            else qDipDir = "NW";

            return `${qStrike} / ${dip}°${qDipDir}`;
        }

        // 更新羅盤與GPS畫面
        function updateSensorUI() {
            // 更新數字顯示
            elStrike.innerText = sensorData.strike.toString().padStart(3, '0');
            elDip.innerText = sensorData.dip.toString().padStart(2, '0');
            
            // 更新方位角象限顯示
            elQuadrant.innerText = getQuadrantString(sensorData.strike, sensorData.dip);

            // 更新坐標顯示 (依照所選坐標系統)
            if (sensorData.lat && sensorData.lng) {
                if (coordSystem === 'WGS84') {
                    elCoords.innerText = `${sensorData.lat.toFixed(5)}, ${sensorData.lng.toFixed(5)}`;
                } else {
                    // 將 WGS84 轉為 TWD97
                    let twd97 = proj4('EPSG:4326', 'EPSG:3826', [sensorData.lng, sensorData.lat]);
                    // TWD97 習慣顯示 X, Y 整數公尺
                    elCoords.innerText = `${twd97[0].toFixed(0)}, ${twd97[1].toFixed(0)}`;
                }
            }
            
            elAcc.innerText = sensorData.accuracy ? sensorData.accuracy.toFixed(0) : '-';
        }

        // 鎖定/解鎖按鈕邏輯
        btnLock.addEventListener('click', () => {
            isLocked = !isLocked;
            
            if (isLocked) {
                // 鎖定狀態
                btnLock.innerText = '解鎖重新讀取';
                btnLock.className = 'bg-yellow-500 text-white mt-4 w-full py-4 rounded-xl font-bold text-lg shadow-md transition-all active:scale-95';
                compassCard.className = 'bg-green-50 p-6 rounded-2xl shadow-lg text-center transition-colors duration-300';
                
                btnSave.className = 'bg-emerald-600 text-white hover:bg-emerald-700 w-full py-5 rounded-xl font-black text-xl shadow-lg flex justify-center items-center gap-2 transition-all active:scale-95';
            } else {
                // 解鎖狀態
                btnLock.innerText = '鎖定數值 (Lock)';
                btnLock.className = 'bg-blue-600 text-white mt-4 w-full py-4 rounded-xl font-bold text-lg shadow-md transition-all active:scale-95';
                compassCard.className = 'bg-white p-6 rounded-2xl shadow-lg text-center transition-colors duration-300';
                
                btnSave.className = 'bg-gray-300 text-gray-500 cursor-not-allowed w-full py-5 rounded-xl font-black text-xl shadow-lg flex justify-center items-center gap-2 transition-all active:scale-95';
            }
        });

        // 設定弱面類型
        function setType(type) {
            currentType = type;
            
            // 重置所有按鈕樣式
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.className = 'type-btn border-gray-200 bg-white text-gray-500 py-3 rounded-lg font-bold border-2 transition-all flex flex-col items-center';
            });
            
            // 標示選中按鈕
            const activeBtn = document.getElementById(`btn-type-${type}`);
            activeBtn.className = 'type-btn border-blue-600 bg-blue-50 text-blue-700 py-3 rounded-lg font-bold border-2 transition-all flex flex-col items-center';

            // 僅在節理面顯示 J1/J2/J3 面板
            if (type === '節理面') {
                jointSetContainer.classList.remove('hidden');
            } else {
                jointSetContainer.classList.add('hidden');
            }
        }

        // 儲存邏輯
        btnSave.addEventListener('click', () => {
            if (!isLocked) {
                alert("請先鎖定數值！");
                return;
            }

            const ocId = `OC-${outcropIndex.toString().padStart(2, '0')}`;
            const isJoint = currentType === '節理面';

            const newData = {
                id: Date.now(),
                time: new Date().toLocaleString('zh-TW'),
                outcrop: ocId,
                type: currentType,
                jointSet: (isJoint && currentJointSet !== '無') ? currentJointSet : '',
                strike: sensorData.strike,
                dip: sensorData.dip,
                quadrant: getQuadrantString(sensorData.strike, sensorData.dip), // 順便存入象限資料
                lat: sensorData.lat, // 一律以 WGS84 格式存入資料庫
                lng: sensorData.lng,
                remark: inputRemark.value
            };

            // 加入陣列前端
            measurements.unshift(newData);
            
            // 重置表單
            isLocked = false;
            btnLock.click(); // 觸發解鎖UI更新
            inputRemark.value = '';
            
            // 更新紀錄列表
            renderList();
            
            // 提示音或簡單震動反饋 (行動裝置支援的話)
            if (navigator.vibrate) navigator.vibrate(50);
            
            // 也可以自訂 Toast 提示，這裡用簡單的 alert 替代
            alert(`成功儲存第 ${measurements.length} 筆資料！`);
        });

        // 渲染紀錄列表
        function renderList() {
            listCount.innerText = measurements.length;
            
            if (measurements.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-gray-400 py-10" id="empty-state">尚無資料，請至測量頁面記錄。</div>';
                return;
            }
            
            listContainer.innerHTML = '';
            
            measurements.forEach(m => {
                let badgeClass = 'bg-gray-100 text-gray-700';
                if (m.type === '層面') badgeClass = 'bg-blue-100 text-blue-700';
                if (m.type === '坡面') badgeClass = 'bg-orange-100 text-orange-700';

                const remarkHtml = m.remark ? `<p class="text-gray-600 text-sm mb-2">${m.remark}</p>` : '';
                const tagHtml = m.jointSet ? `<span class="bg-purple-100 text-purple-700 px-2 py-1 text-xs font-bold rounded-md ml-1">${m.jointSet}</span>` : '';
                
                const itemHtml = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 relative">
                        <span class="absolute top-4 right-4 text-xs font-bold text-gray-800 bg-gray-100 px-2 py-1 rounded">${m.outcrop}</span>
                        <div class="text-xs text-gray-500 mb-2">${m.time.split(' ')[1]}</div>
                        <div class="flex items-center gap-1 mb-1 flex-wrap">
                            <span class="px-2 py-1 text-xs font-bold rounded-md ${badgeClass}">${m.type}</span>
                            ${tagHtml}
                            <span class="font-bold text-lg ml-1">${m.strike}° / ${m.dip}°</span>
                        </div>
                        <div class="text-sm font-semibold text-blue-600 mb-2">${m.quadrant}</div>
                        ${remarkHtml}
                        <div class="text-xs text-gray-400 flex items-center gap-1">
                            <i data-feather="map-pin" class="w-3 h-3"></i> ${m.lng.toFixed(5)}, ${m.lat.toFixed(5)} (WGS84)
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', itemHtml);
            });
            
            // 重新繪製新加入的 icons
            feather.replace();
        }

        // 匯出 KML 邏輯
        function exportKML() {
            if (measurements.length === 0) {
                alert("目前沒有資料可以匯出");
                return;
            }

            let kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>地質量測紀錄_${new Date().toLocaleDateString()}</name>\n`;

            measurements.forEach(m => {
                const jointInfo = m.jointSet ? ` (${m.jointSet})` : '';
                kmlContent += `    <Placemark>
      <name>${m.outcrop} - ${m.type}${jointInfo}</name>
      <description>
        時間: ${m.time}
        露頭: ${m.outcrop}
        類型: ${m.type}${jointInfo}
        走向/傾角: ${m.strike}° / ${m.dip}°
        方位角表示: ${m.quadrant}
        備註: ${m.remark}
      </description>
      <Point>
        <coordinates>${m.lng},${m.lat},0</coordinates> <!-- 這裡的坐標必須是 WGS84 格式 -->
      </Point>
    </Placemark>\n`;
            });

            kmlContent += `  </Document>\n</kml>`;

            const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `GeoData_${Date.now()}.kml`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 切換 Tab 邏輯
        function switchTab(tabId) {
            // 隱藏所有內容
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            
            // 重置所有導航按鈕狀態
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-600');
                btn.classList.add('text-gray-400', 'hover:text-gray-600');
                btn.querySelector('div').classList.remove('scale-110');
                btn.querySelector('div').classList.add('scale-100');
            });

            // 顯示目標內容
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            
            // 啟用目標導航按鈕
            const activeBtn = document.getElementById(`nav-${tabId}`);
            activeBtn.classList.remove('text-gray-400', 'hover:text-gray-600');
            activeBtn.classList.add('text-blue-600');
            activeBtn.querySelector('div').classList.remove('scale-100');
            activeBtn.querySelector('div').classList.add('scale-110');
        }

        // 初始化啟動
        startSensor();
        
    </script>
</body>
</html>
